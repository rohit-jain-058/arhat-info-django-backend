name: Deploy Django to Cloud Run

on:
  push:
    branches: [main, develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'develop' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} 

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Set environment by branch
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "BUILD_ENV=production"                          >> $GITHUB_ENV
            echo "DJANGO_SETTINGS_MODULE=config.settings.production"  >> $GITHUB_ENV
            # Prod-only: Direct VPC egress so Cloud Run can reach prod-db
            # on its private IP. PROD_VPC_NETWORK / PROD_VPC_SUBNET are
            # GitHub repo variables — set them to match what you created
            # in the Console (e.g. network "default", subnet "prod-cloudrun-subnet").
            echo "VPC_FLAGS=--network=${{ vars.PROD_VPC_NETWORK }} --subnet=${{ vars.PROD_VPC_SUBNET }} --vpc-egress=private-ranges-only" >> $GITHUB_ENV
          else
            echo "BUILD_ENV=development"                         >> $GITHUB_ENV
            echo "DJANGO_SETTINGS_MODULE=config.settings.development" >> $GITHUB_ENV
            echo "VPC_FLAGS="                                     >> $GITHUB_ENV
          fi

      - name: Generate .env.yaml
        run: |
          cat > .env.yaml << EOF
          # Django
          DJANGO_SETTINGS_MODULE: "${{ env.DJANGO_SETTINGS_MODULE }}"
          SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
          BUILD_ENV: "${{ env.BUILD_ENV }}"
          DEBUG: "${{ vars.DEBUG }}"
          ALLOWED_HOSTS: "${{ vars.ALLOWED_HOSTS }}"

          # Common — hardcoded (non-sensitive)
          EMAIL_HOST: "${{ vars.EMAIL_HOST }}"
          EMAIL_PORT: "${{ vars.EMAIL_PORT }}"
          EMAIL_USE_TLS: "${{ vars.EMAIL_USE_TLS }}"
          EMAIL_HOST_USER: "${{ vars.EMAIL_HOST_USER }}"
          DEFAULT_FROM_EMAIL: "${{ vars.DEFAULT_FROM_EMAIL }}"
          TEAM_EMAIL: "${{ vars.TEAM_EMAIL }}"

          # Environment Variables
          DB_HOST: "${{ vars.DB_HOST }}"
          DB_NAME: "${{ vars.DB_NAME }}"
          FRONTEND_URL: "${{ vars.FRONTEND_URL }}"
          JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "${{ vars.JWT_ACCESS_TOKEN_LIFETIME_MINUTES }}"
          JWT_REFRESH_TOKEN_LIFETIME_DAYS: "${{ vars.JWT_REFRESH_TOKEN_LIFETIME_DAYS }}"
          TENANT_ID: "${{ vars.TENANT_ID }}"
          CLIENT_ID: "${{ vars.CLIENT_ID }}"

          # Environment Secrets
          DB_USER: "${{ secrets.DB_USER }}"
          CLIENT_SECRET: "${{ secrets.CLIENT_SECRET }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"
          STRIPE_PUBLISHABLE_KEY: "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          STRIPE_WEBHOOK_SECRET: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          EMAIL_HOST_PASSWORD: "${{ secrets.EMAIL_HOST_PASSWORD }}"

          # Encrypted Secrets
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
          EOF

      # - name: Build and push image
      #   run: |
      #     gcloud builds submit \
      #       --tag gcr.io/${{ vars.GCP_PROJECT_ID }}/django-backend-${{ env.BUILD_ENV }} \
      #       --suppress-logs \
      #       . || true

      # - name: Deploy to Cloud Run
      #   run: |
      #     gcloud run deploy django-backend-${{ env.BUILD_ENV }} \
      #       --image gcr.io/${{ vars.GCP_PROJECT_ID }}/django-backend-${{ env.BUILD_ENV }} \
      #       --region ${{ vars.GCP_REGION }} \
      #       --allow-unauthenticated \
      #       --env-vars-file .env.yaml \
      #       ${{ env.VPC_FLAGS }}
      # - name: Run migrations
      #   run: |
      #     gcloud run jobs create migrate-${{ github.run_number }} \
      #       --image gcr.io/${{ vars.GCP_PROJECT_ID }}/django-backend-${{ env.BUILD_ENV }} \
      #       --region ${{ vars.GCP_REGION }} \
      #       --env-vars-file .env.yaml \
      #       --command "python" \
      #       --args "manage.py,migrate" \
      #       --execute-now \
      #       --wait \
      #       --max-retries 0 \
      #       ${{ env.VPC_FLAGS }}
      - name: Run migrations
        run: |
          gcloud run jobs create update-plans-live \
            --image gcr.io/arhat-info-tools/django-backend-${{ env.BUILD_ENV }} \
            --region us-east1 \
            --env-vars-file .env.yaml \
            --command "python" \
            --args "manage.py,update_plans" \
            --execute-now \
            --wait \
            --max-retries 0 \
            --network=tylented-prod-vpc \
            --subnet=production-cloud-run \
            --vpc-egress=private-ranges-only


      # - name: Clean up migration job
      #   if: always()
      #   run: |
      #     gcloud run jobs delete migrate-${{ github.run_number }} \
      #       --region ${{ vars.GCP_REGION }} \
      #       --quiet
