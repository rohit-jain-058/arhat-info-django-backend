name: Deploy Django to Cloud Run

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate .env.yaml
        run: |
          cat > .env.yaml << EOF
          DJANGO_SETTINGS_MODULE: "config.settings.development"
          SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
          DEBUG: "True"
          ALLOWED_HOSTS: "${{ vars.ALLOWED_HOSTS }}"
          FRONTEND_URL: "${{ vars.FRONTEND_URL }}"
          OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          JWT_ACCESS_TOKEN_LIFETIME_MINUTES: "60"
          JWT_REFRESH_TOKEN_LIFETIME_DAYS: "7"
          USE_S3: "False"
          AWS_ACCESS_KEY_ID: "${{ secrets.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY: "${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          AWS_STORAGE_BUCKET_NAME: "${{ vars.AWS_STORAGE_BUCKET_NAME }}"
          AWS_S3_REGION_NAME: "us-east-1"
          SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"
          SENTRY_ENVIRONMENT: "development"
          EMAIL_HOST: "smtp.office365.com"
          EMAIL_PORT: "587"
          EMAIL_USE_TLS: "True"
          EMAIL_HOST_USER: "${{ vars.EMAIL_HOST_USER }}"
          EMAIL_HOST_PASSWORD: "${{ secrets.EMAIL_HOST_PASSWORD }}"
          DEFAULT_FROM_EMAIL: "${{ vars.EMAIL_HOST_USER }}"
          TEAM_EMAIL: "${{ vars.EMAIL_HOST_USER }}"
          TENANT_ID: "${{ secrets.TENANT_ID }}"
          CLIENT_ID: "${{ secrets.CLIENT_ID }}"
          CLIENT_SECRET: "${{ secrets.CLIENT_SECRET }}"
          DB_HOST: "${{ secrets.DB_HOST }}"
          DB_NAME: "${{ secrets.DB_NAME }}"
          DB_USER: "${{ secrets.DB_USER }}"
          DB_PASSWORD: "${{ secrets.DB_PASSWORD }}"
          STRIPE_SECRET_KEY: "${{ secrets.STRIPE_SECRET_KEY }}"
          STRIPE_PUBLISHABLE_KEY: "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          STRIPE_WEBHOOK_SECRET: "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          EOF

      - name: Build and push image
        run: |
          gcloud builds submit \
            --tag gcr.io/${{ vars.GCP_PROJECT_ID }}/chatbot-arhatinfo \
            .

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy chatbot-arhatinfo \
            --image gcr.io/${{ vars.GCP_PROJECT_ID }}/chatbot-arhatinfo \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --env-vars-file .env.yaml \
            --add-cloudsql-instances ${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ vars.CLOUD_SQL_INSTANCE }}

      - name: Run migrations
        run: |
          gcloud run jobs create migrate-${{ github.run_number }} \
            --image gcr.io/${{ vars.GCP_PROJECT_ID }}/chatbot-arhatinfo \
            --region ${{ vars.GCP_REGION }} \
            --env-vars-file .env.yaml \
            --add-cloudsql-instances ${{ vars.GCP_PROJECT_ID }}:${{ vars.GCP_REGION }}:${{ vars.CLOUD_SQL_INSTANCE }} \
            --command "python" \
            --args "manage.py,migrate" \
            --execute-now \
            --wait \
            --max-retries 0

      - name: Clean up migration job
        if: always()
        run: |
          gcloud run jobs delete migrate-${{ github.run_number }} \
            --region ${{ vars.GCP_REGION }} \
            --quiet